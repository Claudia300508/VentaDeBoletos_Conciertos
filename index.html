<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UCA TICKETS | Inicia sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth">

    <!-- Panel de marca: solo se ve en escritorio -->
    <aside class="brand-panel" aria-hidden="true">
      <div class="logo">
        <span class="logo-mark">U</span>
        <span class="logo-text">UCA TICKETS</span>
      </div>
      <div class="tagline-box">
        <p class="tagline">Vive la música en vivo.</p>
        <p class="tagline-sub">Compra tus boletos en pocos pasos y lleva tus entradas siempre contigo.</p>
      </div>
    </aside>

    <section class="form-panel">
     
      <div class="logo logo--top">
        <span class="logo-mark" aria-hidden="true">U</span>
        <span class="logo-text">UCA TICKETS</span>
      </div>

      <div class="card">

        <section aria-labelledby="t-login">
          <header class="view-header">
            <h1 id="t-login">Inicia sesión</h1>
            <p>Entra para comprar tus boletos y ver tus entradas.</p>
          </header>

          <form id="form-login" novalidate>
            <div class="field">
              <label for="login-email">Correo electrónico</label>
              <input id="login-email" name="email" type="email" autocomplete="email"
                     placeholder="tucorreo@ejemplo.com" aria-describedby="login-email-error">
              <p class="error" id="login-email-error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="login-pass">Contraseña</label>
              <div class="input-wrap">
                <input id="login-pass" name="password" type="password" autocomplete="current-password"
                       placeholder="••••••••" aria-describedby="login-pass-error">
                <button type="button" class="toggle-pass" data-target="login-pass"
                        aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
              </div>
              <p class="error" id="login-pass-error" aria-live="polite"></p>
            </div>

            <!-- Por ahora no lleva a ninguna parte (ver script.js) -->
            <a class="link link--end" href="#" id="link-recuperar">¿Olvidaste tu contraseña?</a>

            <button class="btn btn--primary" type="submit">Iniciar sesión</button>
            <p class="status" aria-live="polite"></p>
          </form>

          <!-- Por ahora no lleva a ninguna parte (ver script.js) -->
          <p class="switch">¿No tienes cuenta? <a class="link" href="#" id="link-registro">Regístrate</a></p>
        </section>

      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
